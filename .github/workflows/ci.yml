name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest

  docker:
    name: Build and smoke-test API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t mbc-api:ci .
      - name: Run and check endpoints
        run: |
          docker run -d --name api -p 8080:8080 mbc-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          curl -sf -X POST http://localhost:8080/optimize \
            -H 'content-type: application/json' -d '{}' | grep -q '"allocation"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/simulate \
            -H 'content-type: application/json' -d '{"weekly_spend": {"podcast": 1}}')
          test "$code" = "422"
      - name: Container logs
        if: always()
        run: docker logs api || true
