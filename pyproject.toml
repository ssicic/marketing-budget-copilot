[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbc"
version = "0.1.0"
description = "Marketing Budget Copilot: Bayesian MMM, geo-lift experiments and an AI budget agent"
requires-python = ">=3.11"
# Pinned exactly: PyMC-Marketing's API changes between minor versions.
dependencies = [
    "pymc-marketing==0.19.2",
    "pymc==5.28.5",
    "pytensor==2.38.3",
    "arviz==0.23.4",
    "numpy==2.4.6",
    "pandas==3.1.0",
    "scipy==1.17.1",
    "statsmodels==0.15.0",
    "matplotlib==3.11.2",
    "xarray==2026.9.0",
    "mlflow==3.17.2",
    "openpyxl==3.1.5",
    "pymc-extras==0.10.0",
    "duckdb==2.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
notebooks = ["jupyterlab==4.6.4", "ipykernel==7.4.0", "nbconvert==7.17.2", "nbformat==5.11.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: fits a real model (run with -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
